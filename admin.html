<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Control Admin</title>
<style>
body { font-family: sans-serif; padding: 1rem; background: #f1f5f9; }
textarea { width: 100%; height: 120px; font-size: 1rem; padding: 8px; box-sizing: border-box; border-radius: 6px; border: 1px solid #cbd5e1; }
.btn { display: block; width: 100%; padding: 12px; margin-top: 10px; font-size: 1rem; font-weight: bold; color: white; border: none; border-radius: 6px; cursor: pointer; }
.send { background: #16a34a; }
.preset { background: #475569; margin-top: 6px; }
</style>
</head>
<body>
<h2>Enviar a PC</h2>
<textarea id="inputCmd" placeholder="Escribe comando o texto..."></textarea>
<button class="btn send" onclick="enviar()">Enviar Texto</button>

<h3>Accesos Rápidos</h3>
<button class="btn preset" onclick="enviarPreset('sfc /scannow')">sfc /scannow</button>
<button class="btn preset" onclick="enviarPreset('DISM /Online /Cleanup-Image /RestoreHealth')">DISM RestoreHealth</button>
<button class="btn preset" onclick="enviarPreset('Get-ExecutionPolicy')">ExecutionPolicy</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyAOEcktDXXSrFSCkHRBP21gfrkFxnl0Kj4",
authDomain: "commandpaste.firebaseapp.com",
projectId: "commandpaste",
databaseURL: "https://commandpaste-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.enviar = function() {
const val = document.getElementById('inputCmd').value;
set(ref(db, 'comando_actual'), val);
}

window.enviarPreset = function(cmd) {
document.getElementById('inputCmd').value = cmd;
enviar();
}
</script>
</body>
</html>
