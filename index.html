<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor Receptor - Chat</title>
  <style>
    :root {
      --bg-dark: #131314;
      --sidebar-bg: #1e1e20;
      --card-bg: #28292c;
      --bubble-bg: #1e293b;
      --accent-blue: #a8c7fa;
      --accent-green: #22c55e;
      --text-main: #e3e3e3;
      --text-muted: #8e918f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar Historiales con edición de nombre */
    .sidebar { width: 280px; background-color: var(--sidebar-bg); border-right: 1px solid #333; display: flex; flex-direction: column; padding: 15px; }
    .sidebar h3 { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
    .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .chat-item { padding: 10px; background: #2a2b2e; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid transparent; }
    .chat-item.active { border-color: var(--accent-blue); background: #37393e; }
    .chat-item input { background: transparent; border: none; color: white; width: 75%; font-size: 0.9rem; outline: none; cursor: pointer; }
    .edit-icon { cursor: pointer; opacity: 0.6; font-size: 0.85rem; }
    .edit-icon:hover { opacity: 1; }

    /* Área principal de Chat */
    .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    header { height: 60px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; }
    header h2 { font-weight: 500; font-size: 1.1rem; color: var(--accent-blue); }
    
    .save-btn { background-color: var(--accent-green); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 600; transition: 0.2s; }
    .save-btn:hover { opacity: 0.9; transform: scale(1.02); }
    .save-btn svg { width: 18px; height: 18px; fill: white; }

    /* Feed de Conversación */
    .chat-container { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    
    /* Burbujas de chat recibidas */
    .message-bubble { 
      align-self: flex-start; 
      max-width: 80%; 
      background: var(--bubble-bg); 
      border: 1px solid #334155; 
      border-radius: 14px; 
      border-top-left-radius: 2px;
      padding: 14px 18px; 
      font-family: 'Consolas', monospace; 
      font-size: 1.05rem; 
      color: #93c5fd; 
      position: relative; 
      word-break: break-all;
      user-select: text; /* Permite seleccionar texto */
    }
    .message-bubble:hover .delete-btn { display: flex; }
    
    /* Botón flotante para eliminar una sola burbuja */
    .delete-btn { 
      display: none; 
      position: absolute; 
      right: -12px; 
      top: -12px; 
      background: #ef4444; 
      color: white; 
      border: none; 
      border-radius: 50%; 
      width: 24px; 
      height: 24px; 
      cursor: pointer; 
      align-items: center; 
      justify-content: center; 
      font-size: 0.75rem; 
    }

    @media (max-width: 600px) { .sidebar { display: none; } }
  </style>

  <!-- Librería estable de Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <!-- Historiales a la izquierda con nombres editables -->
  <div class="sidebar">
    <h3>Historial de Chats</h3>
    <div class="chat-list" id="chatList">
      <div class="chat-item active" onclick="cargarChat('envivo')">
        <input type="text" value="Conversación en Vivo" id="h1" readonly>
        <span class="edit-icon" onclick="renombrar(event, 'h1')">✏️</span>
      </div>
    </div>
  </div>

  <div class="main-content">
    <header>
      <h2 id="chatTitle">Vista Receptor (Tiempo Real)</h2>
      <button class="save-btn" onclick="guardarConversacion()">
        <svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
        Guardar
      </button>
    </header>

    <!-- Contenedor donde van cayendo las burbujas -->
    <div class="chat-container" id="chatContainer">
      <!-- Los mensajes del admin se insertan aquí automáticamente -->
    </div>
  </div>

  <script>
    const firebaseConfig = { databaseURL: "https://commandpaste-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let contadorHistorial = 1;

    // Escuchar mensajes entrantes del Admin en tiempo real
    db.ref('comando_actual').on('value', (snapshot) => {
      const val = snapshot.val();
      if (val) {
        agregarBurbuja(val);
      }
    });

    function agregarBurbuja(texto) {
      const container = document.getElementById('chatContainer');
      
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.innerText = texto;

      // Botón flotante para eliminar la burbuja si lo desea el usuario
      const btnDel = document.createElement('button');
      btnDel.className = 'delete-btn';
      btnDel.innerText = '🗑️';
      btnDel.onclick = (e) => {
        e.stopPropagation();
        bubble.remove();
      };

      bubble.appendChild(btnDel);
      container.appendChild(bubble);
      container.scrollTop = container.scrollHeight; // Desplazar hacia abajo automáticamente
    }

    // Permite renombrar elementos del historial en la barra izquierda
    function renombrar(e, id) {
      e.stopPropagation();
      const input = document.getElementById(id);
      input.removeAttribute('readonly');
      input.focus();
      input.onblur = () => input.setAttribute('readonly', true);
    }

    // Guardar la conversación actual en el historial de la izquierda
    function guardarConversacion() {
      const container = document.getElementById('chatContainer');
      if (container.children.length === 0) {
        alert("No hay mensajes para guardar en la conversación.");
        return;
      }

      contadorHistorial++;
      const chatList = document.getElementById('chatList');
      const nuevoId = 'h' + contadorHistorial;

      const chatItem = document.createElement('div');
      chatItem.className = 'chat-item';
      chatItem.innerHTML = `
        <input type="text" value="Plática Guardada ${contadorHistorial}" id="${nuevoId}" readonly>
        <span class="edit-icon" onclick="renombrar(event, '${nuevoId}')">✏️</span>
      `;
      
      chatList.appendChild(chatItem);
      alert("Conversación guardada con éxito en la lista izquierda.");
    }
  </script>
</body>
</html>
