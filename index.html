<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Administración</title>
<style>
:root {
--bg-dark: #131314;
--sidebar-bg: #1e1e20;
--card-bg: #28292c;
--accent-blue: #a8c7fa;
--accent-green: #22c55e;
--text-main: #e3e3e3;
--text-muted: #8e918f;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

/* Sidebar para editar comandos y pláticas */
.sidebar { width: 260px; background-color: var(--sidebar-bg); border-right: 1px solid #333; display: flex; flex-direction: column; padding: 15px; }
.sidebar h3 { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
.chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.chat-item { padding: 10px; background: #2a2b2e; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
.chat-item input { background: transparent; border: none; color: white; width: 80%; font-size: 0.9rem; outline: none; }
.edit-icon { cursor: pointer; opacity: 0.6; font-size: 0.8rem; }

/* Panel Principal Gemini-Style */
.main-panel { flex: 1; display: flex; flex-direction: column; height: 100vh; }
header { height: 60px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }

.save-btn { background-color: var(--accent-green); color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 600; }
.save-btn svg { width: 18px; height: 18px; fill: white; }

/* Historial superior y input inferior */
.history-view { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.sent-card { background: var(--card-bg); padding: 15px; border-radius: 12px; border-left: 4px solid var(--accent-blue); font-family: monospace; word-break: break-all; }

.input-container { padding: 15px; background: var(--sidebar-bg); border-top: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
textarea { width: 100%; height: 75px; background: #131314; border: 1px solid #444; border-radius: 10px; color: white; padding: 12px; font-size: 1rem; resize: none; outline: none; }
textarea:focus { border-color: var(--accent-blue); }

.action-btn { background: var(--accent-green); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
.action-btn:hover { opacity: 0.9; }

@media (max-width: 600px) {
.sidebar { display: none; }
}
</style>

<!-- Librerías estables de Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="sidebar">
<h3>Comandos / Listas</h3>
<div class="chat-list">
<div class="chat-item">
<input type="text" value="Sesión Activa" id="p1" readonly>
<span class="edit-icon" onclick="renombrar('p1')">✏️</span>
</div>
</div>
</div>

<div class="main-panel">
<header>
<h3>Panel Admin</h3>
<button class="save-btn" onclick="alert('Historial guardado localmente')">
<svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
Guardar
</button>
</header>

<div class="history-view" id="historyView">
<div class="sent-card">Comandos enviados recientemente:</div>
</div>

<div class="input-container">
<textarea id="cmdInput" placeholder="Escribe tu comando o texto aquí..."></textarea>
<button class="action-btn" onclick="enviarComando()">Enviar Texto</button>
</div>
</div>

<script>
// Configuración usando compatibilidad Firebase v8
const firebaseConfig = {
databaseURL: "https://commandpaste-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function enviarComando() {
const input = document.getElementById('cmdInput');
const val = input.value.trim();
if(!val) return;

// Enviar a la base de datos
db.ref('comando_actual').set(val);

// Agregar a la lista del celular
const historyView = document.getElementById('historyView');
const card = document.createElement('div');
card.className = 'sent-card';
card.innerText = val;
historyView.appendChild(card);

// Limpiar texto
input.value = '';
}

function renombrar(id) {
const el = document.getElementById(id);
el.removeAttribute('readonly');
el.focus();
el.onblur = () => el.setAttribute('readonly', true);
}
</script>
</body>
</html>
