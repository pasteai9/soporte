<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Receptor - Soporte</title>
<style>
:root {
--bg-dark: #131314;
--sidebar-bg: #1e1e20;
--card-bg: #28292c;
--accent-blue: #a8c7fa;
--accent-green: #22c55e;
--text-main: #e3e3e3;
--text-muted: #8e918f;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

/* Sidebar Historial */
.sidebar { width: 260px; background-color: var(--sidebar-bg); border-right: 1px solid #333; display: flex; flex-direction: column; padding: 15px; }
.sidebar h3 { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 15px; letter-spacing: 1px; }
.chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.chat-item { padding: 10px 12px; background: #2a2b2e; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
.chat-item.active { background-color: #37393e; color: var(--accent-blue); border-left: 3px solid var(--accent-blue); }

/* Contenido Principal */
.main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; }
header { height: 60px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; padding: 0 25px; }
header h2 { font-weight: 500; font-size: 1.1rem; }

.save-btn { background-color: var(--accent-green); color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 600; }
.save-btn:hover { opacity: 0.9; }
.save-btn svg { width: 18px; height: 18px; fill: white; }

/* Display Receptor */
.display-area { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.card { background: var(--card-bg); border-radius: 16px; border: 1px solid #3c4043; width: 100%; max-width: 800px; padding: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.card-title { color: var(--accent-blue); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; margin-bottom: 12px; }
.content-box { font-family: 'Consolas', monospace; font-size: 1.2rem; background: #18191b; padding: 20px; border-radius: 10px; border: 1px solid #333; white-space: pre-wrap; word-break: break-all; color: #75b5fe; min-height: 120px; }
.copy-btn { margin-top: 15px; width: 100%; padding: 12px; background: var(--accent-blue); color: #040c17; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
.copy-btn:hover { background: #c2e7ff; }

@media (max-width: 600px) {
.sidebar { display: none; }
}
</style>

<!-- Librerías estables de Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="sidebar">
<h3>Historiales</h3>
<div class="chat-list">
<div class="chat-item active"><span>Comando Actual</span></div>
</div>
</div>

<div class="main-content">
<header>
<h2>Terminal Receptor</h2>
<button class="save-btn" onclick="alert('Guardado localmente')">
<svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
Guardar
</button>
</header>

<div class="display-area">
<div class="card">
<div class="card-title">Texto / Comando recibido en tiempo real</div>
<div class="content-box" id="receptorText">Esperando datos...</div>
<button class="copy-btn" onclick="copiarAlPortapapeles()">Copiar al portapapeles</button>
</div>
</div>
</div>

<script>
// Configuración usando compatibilidad Firebase v8
const firebaseConfig = {
databaseURL: "https://commandpaste-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Escuchar cambios en la base de datos
db.ref('comando_actual').on('value', (snapshot) => {
document.getElementById('receptorText').innerText = snapshot.val() || "Esperando datos...";
});

function copiarAlPortapapeles() {
const txt = document.getElementById('receptorText').innerText;
navigator.clipboard.writeText(txt);
alert("¡Texto copiado al portapapeles!");
}
</script>
</body>
</html>
